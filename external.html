<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <tittle>CSS</tittle>
    <style>
        h1{
            border-width: 5px;
            #aa{
                outline:5px solid blue;
            }
        }
        body{
            background-color: blanchedalmond;
        }
        body{
            margin-left: 3cm;
            margin-top: 4cm;
            margin-right: 3cm;
        }
        h1{
            text-align:center
        }
        h1{
            background-color: green;
            display:inline;
        }
        h1{
            background-color: green;
            display:block;
        }
    </style>
</head>
<body>
    <h1 class="bluecolor bgcolor">HTML and CSS learning </h1>
    <h1>My name is Rahul Ranjan</h1>
    <h1 id="yellowcolor">HTML and CSS learning</h1>
    <h1 id="aa" style="border-style:dotted;">Inline css</h1>
    <h1 style="border-style:solid;">Internal CSS </h1>
    <h1 style="border-style:dashed;">External css</h1>
    <h1 style="border-style:double;">External css</h1>
    <h1 style="border-style:groove;">External css</h1>
    <h1 style="border-style:ridge;">External css</h1>
    <h1 style="border-style:inset;">External css</h1>

</body>
</html>
